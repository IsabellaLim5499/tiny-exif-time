[project]
name = "tiny-exif-time"
version = "0.1.0"
description = "Converts EXIF date-time metadata from images into timezone-aware datetime objects."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
